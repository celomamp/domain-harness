name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # No usage data leaves CI.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # The pinned pnpm (package.json "packageManager") is fetched without a prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Build, typecheck, lint, boundaries, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the engines floor; 26 is the LTS target.
        node: [24, 26]
    services:
      # The registry database suite (apps/registry, tenancy.db.test.ts) runs
      # against this throwaway PostgreSQL 18; it fails when CI is set without it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          # Throwaway CI-only service password, not a secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REGISTRY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SERVICE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # Node 25+ no longer bundles corepack, so install it on every version.
      - name: Enable pnpm through corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable pnpm
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Boundaries
        run: pnpm run boundaries

      - name: Test
        run: pnpm test
