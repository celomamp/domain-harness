# Staging: Company Standards guidance server — Guidance MCP endpoint plus the
# credentialed Read API (Fly app dh-guidance-staging).
# Region iad (next to the Supabase staging project in us-east-1). Pilot mode:
# public at https://dh-guidance-staging.fly.dev/mcp, gated by the Bearer token
# in SERVICE_GUIDANCE_ACCESS_TOKEN (never allocate public IPs without it); also
# reachable over Fly private networking at http://dh-guidance-staging.internal:8080.
# Secrets (fly secrets set, never committed): SERVICE_TENANT_ID,
# SERVICE_TENANT_CREDENTIAL, SERVICE_RECORD_DATABASE_URL,
# SERVICE_READ_CREDENTIAL, SERVICE_ROLE_TOKEN_TRUST_KEYS,
# SERVICE_GUIDANCE_ACCESS_TOKEN. See docs/staging.md.
app = "dh-guidance-staging"
primary_region = "iad"

[build]
  dockerfile = "apps/service/Dockerfile.guidance"

[env]
  SERVICE_VENDOR_URL = "http://dh-registry-staging.internal:4100"
  SERVICE_GUIDANCE_PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # The pilot's public endpoint (token-gated, see header); internal traffic
  # uses the 6PN address (dh-guidance-staging.internal:8080) directly.
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # TCP only: the guidance server exposes no HTTP health endpoint.

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
